- title: Research Interests
  type: nested_list
  contents:
    - title: Spatial transcriptomics and single-cell multiomics
      items:
        - Modeling coordinated cell-state changes across cell types and tissue sections.
        - Integrating single-cell multiomics to study cellular regulation and tissue organization.
    - title: Single-cell epigenomics
      items:
        - Separating latent chromatin accessibility from assay measurement and capture processes.
        - Testing the effects of multiple biological factors on chromatin accessibility.
    - title: Biological sequences
      items:
        - Combining language models with mechanistic models of B-cell receptor evolution.
        - Distinguishing mutation, codon preference, and amino-acid selection.

- title: Research Software
  type: time_table
  contents:
    - title: '<a href="https://github.com/Zhen-Miao/CoPro">CoPro</a>'
      description:
        - Detects coordinated cell-state progression in spatial transcriptomics.
        - '<a href="https://github.com/Zhen-Miao/copro-python">Python implementation</a>.'
    - title: '<a href="https://github.com/Zhen-Miao/PACS">PACS</a>'
      description:
        - Depth-corrected multifactor testing of chromatin accessibility in scATAC-seq.
    - title: '<a href="https://github.com/Zhen-Miao/PICsnATAC">PIC</a>'
      description:
        - Corrects insertion-counting artifacts in single-nucleus ATAC-seq quantification.

